<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AngKupi — Menu</title>
<style>
  :root{
    --brown:#4b2c20; --cream:#f3ebe4; --accent:#f2d3b6; --muted:#7a6153;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter, "Segoe UI", Roboto, Arial;background:var(--cream);color:#2b1a13}
  header{background:var(--brown);color:white;padding:16px;text-align:center;font-weight:700;font-size:20px}
  .wrap{padding:14px;max-width:1000px;margin:0 auto}
  .topbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
  .topbar .left{flex:1}
  .btn{background:var(--brown);color:white;border:none;padding:8px 12px;border-radius:8px;cursor:pointer}
  .btn.alt{background:var(--accent);color:var(--brown);font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .card{background:white;border-radius:12px;padding:10px;box-shadow:0 6px 18px rgba(0,0,0,0.08);display:flex;flex-direction:column}
  .card img{width:100%;height:140px;object-fit:cover;border-radius:8px}
  .title{font-weight:700;margin:8px 0 6px;color:var(--brown)}
  .price{color:var(--muted);font-weight:700;margin-bottom:8px}
  .qtyRow{display:flex;gap:8px;align-items:center;margin-top:auto}
  .inpQty{width:70px;padding:6px;border-radius:8px;border:1px solid #eee}
  .cartBar{position:fixed;right:14px;bottom:14px;background:white;padding:12px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,0.12);width:320px;max-width:calc(100% - 28px)}
  .cartList{max-height:220px;overflow:auto;margin-bottom:8px}
  .cartRow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed #f0e9e4}
  .small{font-size:13px;color:#6b5446}
  .flex{display:flex;gap:8px;align-items:center}
  .orderSection{margin-top:10px}
  .hidden{display:none}
  /* modal */
  .modalBg{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:white;border-radius:10px;padding:14px;max-width:700px;width:100%;max-height:90vh;overflow:auto}
  .table{width:100%;border-collapse:collapse}
  .table th,.table td{padding:8px;border-bottom:1px solid #eee;text-align:left}
  .badge{background:var(--accent);color:var(--brown);padding:4px 8px;border-radius:999px;font-weight:700}
  footer{padding:18px;text-align:center;color:#6b5446;font-size:13px}
  @media(max-width:760px){ .cartBar{left:12px;right:12px;width:auto} .grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
  <header>🍮 AngKupi — Menu & Pemesanan</header>

  <div class="wrap">
    <div class="topbar">
      <div class="left">
        <span class="small">Scan QR di meja atau buka halaman ini.</span>
      </div>
      <div class="flex">
        <button class="btn" id="btnViewOrders">Lihat Pesanan (Kasir)</button>
        <button class="btn alt" id="btnResetLocal" title="Hapus semua pesanan di browser ini">Reset Lokal</button>
      </div>
    </div>

    <div id="menuGrid" class="grid" aria-live="polite"></div>

    <!-- cart floating -->
    <div class="cartBar" role="region" aria-label="Keranjang">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><strong>Keranjang</strong><div class="small" id="cartCount">0 item</div></div>
        <div class="badge" id="cartTotalRp">Rp 0</div>
      </div>

      <div class="cartList" id="cartList"></div>

      <div class="orderSection">
        <input id="tableNo" type="number" min="1" placeholder="Masukkan nomor meja" style="width:100%;padding:8px;border-radius:8px;border:1px solid #eee;margin-bottom:8px">
        <div style="display:flex;gap:8px">
          <button class="btn" id="btnSubmit">Kirim ke Kasir</button>
          <button class="btn alt" id="btnClearCart">Kosongkan</button>
        </div>
      </div>
    </div>
  </div>

  <footer>AngKupi • Simple local ordering • Simpan di browser (localStorage)</footer>

  <!-- modal orders -->
  <div id="modalOrders" class="hidden">
    <div class="modalBg" id="modalBg">
      <div class="modal" role="dialog" aria-modal="true">
        <h3>Daftar Pesanan (dari browser ini)</h3>
        <table class="table" id="ordersTable">
          <thead><tr><th>Waktu</th><th>Meja</th><th>Items</th><th>Total</th><th>Aksi</th></tr></thead>
          <tbody></tbody>
        </table>
        <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
          <button class="btn alt" id="btnCloseModal">Tutup</button>
          <button class="btn" id="btnExportCsv">Export CSV</button>
          <button class="btn" id="btnClearOrders">Hapus Semua</button>
        </div>
      </div>
    </div>
  </div>

<script>
/*
  Single-file AngKupi HTML
  - Edit `menuData` di bawah untuk ubah menu
  - Simpan file -> buka di browser
  - Untuk diakses semua HP: upload file ke hosting static (Netlify / GitHub Pages / Neocities)
  - Tanpa hosting: file bisa dibuka langsung (tapi hanya device yg punya filenya)
*/

// ---------- Data menu (edit sesuai kebutuhan) ----------
const menuData = [
  { id: 'm1', name: "Es Kopi Susu", price: 15000, img: "https://i.imgur.com/Eatkd0F.jpg", desc: "Kopi susu seger" },
  { id: 'm2', name: "Americano", price: 12000, img: "https://i.imgur.com/WfIuW8U.jpg", desc: "Espresso + air panas" },
  { id: 'm3', name: "Cappuccino", price: 18000, img: "https://i.imgur.com/Sx6fyf1.jpg", desc: "Susu berbusa" },
  { id: 'm4', name: "Matcha Latte", price: 20000, img: "https://i.imgur.com/tn3w1nZ.jpg", desc: "Matcha lembut" },
  { id: 'm5', name: "Roti Bakar", price: 12000, img: "https://i.imgur.com/pMmtpMv.jpg", desc: "Roti keren" },
  { id: 'm6', name: "Kentang Goreng", price: 10000, img: "https://i.imgur.com/3nLs5Wo.jpg", desc: "Crispy fries" }
];

// ---------- App state ----------
let cart = JSON.parse(localStorage.getItem('angkupi_cart') || '[]');
const ORDERS_KEY = 'angkupi_orders'; // saved orders in this browser
const LOCAL_RESET_CONFIRM = true;

// ---------- Helpers ----------
function formatRp(n){ return 'Rp ' + Number(n).toLocaleString('id-ID'); }
function saveCart(){ localStorage.setItem('angkupi_cart', JSON.stringify(cart)); renderCart(); }
function pushOrder(order){
  const arr = JSON.parse(localStorage.getItem(ORDERS_KEY) || '[]');
  arr.unshift(order);
  localStorage.setItem(ORDERS_KEY, JSON.stringify(arr));
}

// ---------- Render menu ----------
function renderMenu(){
  const g = document.getElementById('menuGrid');
  g.innerHTML = '';
  menuData.forEach(item=>{
    const el = document.createElement('div'); el.className='card item';
    el.innerHTML = `
      <img src="${item.img}" alt="${item.name}">
      <div class="title name">${item.name}</div>
      <div class="small">${item.desc || ''}</div>
      <div class="price">${formatRp(item.price)}</div>
      <div class="qtyRow">
        <input class="inpQty" id="qty_${item.id}" type="number" value="1" min="1">
        <button class="btn" onclick="addToCart('${item.id}')">Tambah</button>
      </div>
    `;
    g.appendChild(el);
  });
}

// ---------- Cart UI ----------
function renderCart(){
  const list = document.getElementById('cartList');
  list.innerHTML = '';
  let total = 0, count=0;
  cart.forEach((c, idx)=>{
    const row = document.createElement('div'); row.className='cartRow';
    row.innerHTML = `<div>
      <div style="font-weight:700">${c.name} <span class="small">x${c.qty}</span></div>
      <div class="small">${formatRp(c.price)} each</div>
    </div>
    <div style="text-align:right">
      <div style="font-weight:700">${formatRp(c.price*c.qty)}</div>
      <div style="margin-top:6px">
        <button onclick="decQty(${idx})" class="small">-</button>
        <button onclick="incQty(${idx})" class="small">+</button>
        <button onclick="removeItem(${idx})" style="margin-left:6px;background:transparent;border:none;color:#c33;cursor:pointer">hapus</button>
      </div>
    </div>`;
    list.appendChild(row);
    total += c.price * c.qty; count += c.qty;
  });
  document.getElementById('cartCount').innerText = count + ' item';
  document.getElementById('cartTotalRp').innerText = formatRp(total);
  document.getElementById('cartTotalRp').dataset.value = total;
}

// cart ops
function addToCart(id){
  const item = menuData.find(m=>m.id===id);
  const q = Math.max(1, Number(document.getElementById('qty_'+id).value || 1));
  const found = cart.find(x=>x.id===id);
  if(found){ found.qty += q; } else { cart.push({id:item.id, name:item.name, price:item.price, qty:q}); }
  saveCart();
  toast('Ditambahkan ke keranjang');
}
function incQty(i){ cart[i].qty++; saveCart(); }
function decQty(i){ cart[i].qty = Math.max(1, cart[i].qty-1); saveCart(); }
function removeItem(i){ cart.splice(i,1); saveCart(); }
function clearCart(){ cart=[]; saveCart(); }

// ---------- Order submit ----------
document.getElementById('btnSubmit').addEventListener('click', () => {
  const table = document.getElementById('tableNo').value.trim();
  if(!table) return alert('Isi nomor meja dulu.');
  if(cart.length===0) return alert('Keranjang kosong.');
  const total = Number(document.getElementById('cartTotalRp').dataset.value || 0);
  const order = {
    id: 'ORD_' + Date.now(),
    time: new Date().toLocaleString(),
    table: table,
    items: JSON.parse(JSON.stringify(cart)),
    total: total
  };
  pushOrder(order);
  clearCart();
  document.getElementById('tableNo').value = '';
  toast('Pesanan terkirim. Kasir cek halaman Pesanan.');
});

// ---------- Orders Modal (Kasir) ----------
const modalOrders = document.getElementById('modalOrders');
const modalBg = document.getElementById('modalBg');
document.getElementById('btnViewOrders').addEventListener('click', openOrders);
document.getElementById('btnCloseModal').addEventListener('click', closeOrders);
document.getElementById('btnClearOrders').addEventListener('click', () => {
  if(!confirm('Hapus semua pesanan di browser ini?')) return;
  localStorage.removeItem(ORDERS_KEY);
  renderOrdersTable();
});
document.getElementById('btnExportCsv').addEventListener('click', exportCsv);
document.getElementById('btnResetLocal').addEventListener('click', () => {
  if(!confirm('Reset semua data local (cart + orders) di browser ini?')) return;
  localStorage.removeItem('angkupi_cart'); localStorage.removeItem(ORDERS_KEY); cart=[]; renderCart(); renderOrdersTable(); toast('Local data direset');
});

function openOrders(){
  modalOrders.classList.remove('hidden');
  renderOrdersTable();
}
function closeOrders(e){
  modalOrders.classList.add('hidden');
}
function renderOrdersTable(){
  const rows = JSON.parse(localStorage.getItem(ORDERS_KEY) || '[]');
  const tbody = document.querySelector('#ordersTable tbody');
  tbody.innerHTML = '';
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    const itemsText = r.items.map(it=>`${it.name} x${it.qty}`).join('; ');
    tr.innerHTML = `<td>${r.time}</td><td>${r.table}</td><td style="max-width:260px">${itemsText}</td><td>${formatRp(r.total)}</td>
      <td><button onclick='markDone("${r.id}")' class="btn alt">Selesai</button></td>`;
    tbody.appendChild(tr);
  });
}
function markDone(id){
  let rows = JSON.parse(localStorage.getItem(ORDERS_KEY) || '[]');
  rows = rows.filter(r=>r.id !== id);
  localStorage.setItem(ORDERS_KEY, JSON.stringify(rows));
  renderOrdersTable();
  toast('Order ditandai selesai.');
}
function exportCsv(){
  const rows = JSON.parse(localStorage.getItem(ORDERS_KEY) || '[]');
  if(!rows.length) return alert('Tidak ada pesanan untuk diexport.');
  let csv = 'id,time,table,items,total\n';
  rows.forEach(r=>{
    const items = r.items.map(i=>`${i.name} x${i.qty}`).join('|');
    csv += `"${r.id}","${r.time}","${r.table}","${items}",${r.total}\n`;
  });
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'angkupi_orders.csv'; a.click();
  URL.revokeObjectURL(url);
}

// ---------- small toast ----------
function toast(msg){
  const t = document.createElement('div'); t.style.position='fixed'; t.style.left='50%'; t.style.transform='translateX(-50%)'; t.style.bottom='90px'; t.style.background='rgba(0,0,0,0.8)'; t.style.color='white'; t.style.padding='8px 12px'; t.style.borderRadius='8px'; t.style.zIndex=9999; t.innerText=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),1600);
}

// ---------- init ----------
renderMenu();
renderCart();
</script>
</body>
</html>
